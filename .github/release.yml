# Categories for GitHub's auto-generated release notes. Each merged PR lands
# under the first category whose label it carries, so labelling a PR is what
# writes the release note - the notes themselves are never hand-maintained.
changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Features
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Maintenance
      labels:
        - chore
    - title: Other changes
      labels:
        - "*"
