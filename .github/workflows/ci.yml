# Gate on every PR and on master. Mirrors the checks the release workflow runs,
# so a tag can never be the first place a build failure shows up.
name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

# A new push supersedes the run still in flight for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm compile

      # Both targets, because wxt resolves the manifest and entrypoints only at
      # build time; neither Biome nor tsc sees those failures.
      - run: pnpm build

      - run: pnpm build:firefox
